[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reborn-broadcaster-native"
version = "0.1.7"
description = "Native Qt control surface and isolated broadcast core for RebornBroadcaster"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "websockets>=13,<17",
]

[project.optional-dependencies]
build = ["nuitka==4.1.1"]

[project.scripts]
reborn-broadcaster = "reborn_broadcaster.app:main"
reborn-broadcaster-core = "reborn_broadcaster.core_main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["reborn_broadcaster"]
